name: AgentOps validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate AgentOps structure
        run: python scripts/validate_agentops.py

      - name: Validate PowerShell entrypoint
        shell: pwsh
        run: ./scripts/agentops.ps1 -Mode Verify